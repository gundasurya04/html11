<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Display</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="navbar"> ...same navbar... </header>

  <main class="product-display">
    <div class="left">
      <img src="images/shoe2.png" alt="Sneaker">
    </div>
    <div class="right">
      <h2>AirMax Sneaker</h2>
      <p>Lightweight, stylish, and durable.</p>
      <p>Price: $120 <span class="sale">Sale: $99</span></p>
      <label>Quantity: <input type="number" value="1"></label>
      <button>Add to Cart</button>
    </div>
  </main>

  <section class="gallery">
    <img src="images/shoe2.png">
    <img src="images/shoe3.png">
    <img src="images/shoe4.png">
  </section>
</body>
</html>
