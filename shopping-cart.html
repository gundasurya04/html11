<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="navbar"> ...same navbar... </header>

  <main class="cart">
    <div class="left">
      <h2>Shopping Cart</h2>
      <table>
        <tr><th>Product</th><th>Qty</th><th>Price</th><th>Remove</th></tr>
        <tr><td>Sneaker</td><td>1</td><td>$99</td><td>❌</td></tr>
      </table>
    </div>

    <div class="right">
      <h3>Order Summary</h3>
      <input type="text" placeholder="Coupon Code">
      <button>Apply</button>
      <p>Subtotal: $99</p>
      <p>Taxes: $5</p>
      <p>Discount: $0</p>
      <p>Total: $104</p>
      <button>Pay Now</button>
    </div>
  </main>

  <footer>
    <a href="product-display.html">Continue Shopping</a>
  </footer>
</body>
</html>
